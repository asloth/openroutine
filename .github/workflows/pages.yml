name: pages

# Publishes the public site, including the privacy policy that Play Console and
# the Google OAuth consent screen link to, at https://asloth.github.io/openroutine/.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/privacy-policy.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy in the privacy policy
        run: |
          {
            printf -- '---\ntitle: Privacy policy\npermalink: /privacy/\n---\n\n'
            cat docs/privacy-policy.md
          } > site/privacy.md
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
