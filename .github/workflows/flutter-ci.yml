name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact Flutter version this repo develops against, so CI
      # resolves the same dependency graph as local dev (see the "Dependency
      # notes" comment in app/pubspec.yaml for why several deps are held back
      # from latest). Bump deliberately, in its own PR.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Freezed/json_serializable/drift/riverpod codegen — M2 onward has
      # annotated sources. Generated files are gitignored (same treatment as
      # the l10n output above), so this must run before analyze/test.
      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # The home screen widget's receiver, service and layouts are Kotlin and
      # XML, which analyze and test never look at — a broken manifest or a
      # Kotlin error would otherwise sail through a green CI run and only fail
      # on someone's machine. The debug build needs no signing secrets (the
      # release config still signs with the debug key), and it runs without
      # dart_define.json, which just leaves Drive visibly unavailable.
      - name: Build Android (debug)
        run: flutter build apk --debug

      # Still no release APK/IPA. §15.12 wants those on every PR, but they
      # need signing config we don't have yet — deferred until M6.
